name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bevy (via the simulator crate) links against the usual Linux windowing/audio
      # stack, so these dev packages are required even just to compile and test.
      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The simulator crate is hand-formatted on purpose, so rustfmt is only enforced
      # on the documentation generator.
      - name: Check formatting
        run: cargo fmt -p deflector-manual --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  docs:
    name: Manual (link check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The manual crate is pure Rust with no windowing/audio dependencies, so no
      # apt packages are needed here. `--check` builds the site in memory and
      # validates every internal link without writing any files to disk.
      - name: Build and validate manual
        run: cargo run -p deflector-manual -- --check

  licenses:
    name: License / dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # A prebuilt binary rather than `cargo install`, which would spend minutes
      # compiling the generator on every pull request and leaves $CARGO_HOME/bin off
      # PATH for subsequent steps. Pinned, because the check below is a byte-for-byte
      # diff and a different version of the generator would fail it for no real reason.
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      # THIRD-PARTY-NOTICES.md ships inside every release artifact, so a stale copy
      # means shipping notices that do not match the binary. Regenerate it and fail
      # if the committed file differs; `cargo about generate about.hbs -o
      # THIRD-PARTY-NOTICES.md` is the fix.
      - name: Check THIRD-PARTY-NOTICES.md is current
        run: |
          set -euo pipefail
          cargo about generate about.hbs -o /tmp/notices-regenerated.md
          diff -u THIRD-PARTY-NOTICES.md /tmp/notices-regenerated.md
