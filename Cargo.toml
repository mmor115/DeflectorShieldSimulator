[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = [
    "Max Morris",
    "Lucas Timotheo Sanches",
    "Steven Robert Brandt"
]
repository = "https://github.com/max-morris/DeflectorShieldSimulator"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["default", "alloc", "derive"] }
serde_json = "1.0.140"
anyhow = "1.0.98"

# Profiles are workspace-root only, so they live here rather than in the member crates.

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Release binaries are downloaded by users, so drop the debug symbols. On Linux this
# takes the executable from ~107 MB to ~69 MB; the same applies to the Windows and
# macOS artifacts. Backtraces from a release build are correspondingly less useful,
# so reproduce bugs against a dev build.
[profile.release]
strip = true
