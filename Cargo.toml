[package]
name = "DeflectorShieldSimulator"
version = "0.1.0"
edition = "2024"

[dependencies]
deflector-core = { git = "ssh://git@github.com/lucass-carneiro/DeflectorShields.git", rev = "764b008" }
bevy = { version = "0.16.1", features = ["default", "png"] }
bevy_picking = { version = "0.16.1", features = ["bevy_mesh_picking_backend"] }
bevy_mod_imgui = "0.7.2"
imgui = "0.12.0"
rand = "0.9.1"
derive_more = { version = "2.0.1", features = ["from", "into", "display"] }
serde = { version = "1.0.219", features = ["default", "alloc", "derive"] }
serde_json = "1.0.140"
uuid = { version = "1.17.0", features = ["v4"] }
rand_xoshiro = { version = "0.7.0", features = ["serde"] }
bincode = { version = "2.0.1", features = ["serde"] }

# Improves bevy runtime performance
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }

# Enables serde compatibility for particle state vectors
nalgebra = { version = "0.33.2", features = ["serde", "serde-serialize"], default-features = false }

[features]
default = []
wayland = ["bevy/wayland"]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
