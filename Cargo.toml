[package]
name = "DeflectorShieldSimulator"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.16.1", features = ["default", "wayland", "png"] }
deflector-core = { git = "ssh://git@github.com-mmor115/lucass-carneiro/DeflectorShields.git", rev = "558734bf" }
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }  # Improves bevy runtime performance
rand = "0.9.1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
