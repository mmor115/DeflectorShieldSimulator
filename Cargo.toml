[package]
name = "DeflectorShieldSimulator"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.16.1", features = ["default", "wayland", "png"] }
bevy_mod_imgui = "0.7.1"
imgui = "0.12.0"
deflector-core = { git = "ssh://git@github.com-mmor115/lucass-carneiro/DeflectorShields.git", rev = "9cfa9069" }
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }  # Improves bevy runtime performance
rand = "0.9.1"
derive_more = { version = "2.0.1", features = ["from"] }
serde = { version = "1.0.219" , features = ["default", "alloc", "derive"]}
serde_json = "1.0.140"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
