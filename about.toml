# cargo-about configuration for THIRD-PARTY-NOTICES.md.
#
# Regenerate the notices with:
#
#   cargo about generate about.hbs -o THIRD-PARTY-NOTICES.md
#
# `accepted` is the same audited set as the `[licenses] allow` list in deny.toml, in
# preference order: where a crate offers a choice, the first entry listed here is the
# one whose text gets reproduced. MIT leads because it is the shortest of the
# permissive licenses and is offered by the overwhelming majority of the tree.
#
# Keep this list and deny.toml in step. deny.toml decides what is allowed into the
# build; this decides which text ships alongside the binary.

# Only the targets we actually publish builds for, so notices do not accumulate for
# platforms nobody receives an artifact for.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Build-time-only dependencies do not ship in the binary, so their notices do not
# need to travel with it.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Every workspace crate is covered by the project's own LICENSE, which is shipped
# alongside this file rather than duplicated inside it.
workarounds = []

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "AGPL-3.0-or-later",
]
